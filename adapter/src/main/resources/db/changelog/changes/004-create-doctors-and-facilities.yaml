databaseChangeLog:
  - changeSet:
      id: create-doctors
      author: kanapa4
      changes:
        - createTable:
            tableName: doctors
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    unique: true
                    foreignKeyName: fk_doctors_user_id
                    references: users(id)
                    deleteCascade: true
              - column:
                  name: first_name
                  type: VARCHAR(255)
              - column:
                  name: last_name
                  type: VARCHAR(255)
              - column:
                  name: specialization
                  type: VARCHAR(255)
      rollback:
        - dropTable:
            tableName: doctors

  - changeSet:
      id: create-facilities
      author: kanapa4
      changes:
        - createTable:
            tableName: facilities
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: city
                  type: VARCHAR(255)
              - column:
                  name: zip_code
                  type: VARCHAR(255)
              - column:
                  name: street
                  type: VARCHAR(255)
              - column:
                  name: building_number
                  type: VARCHAR(255)
      rollback:
        - dropTable:
            tableName: facilities

  - changeSet:
      id: create-doctor-facility
      author: kanapa4
      changes:
        - createTable:
            tableName: doctor_facility
            columns:
              - column:
                  name: doctor_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_doctor_facility_doctor_id
                    references: doctors(id)
                    deleteCascade: true
              - column:
                  name: facility_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_doctor_facility_facility_id
                    references: facilities(id)
                    deleteCascade: true
      rollback:
        - dropTable:
            tableName: doctor_facility

  - changeSet:
      id: add-doctor-facility-pk
      author: kanapa4
      changes:
        - addPrimaryKey:
            tableName: doctor_facility
            columnNames: doctor_id, facility_id
            constraintName: pk_doctor_facility
      rollback:
        - dropPrimaryKey:
            tableName: doctor_facility
            constraintName: pk_doctor_facility
