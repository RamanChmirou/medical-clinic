databaseChangeLog:
  - changeSet:
      id: 004-create-doctors
      author: kanapa4
      changes:
        - createTable:
            tableName: doctors
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    unique: true
              - column:
                  name: first_name
                  type: VARCHAR(255)
              - column:
                  name: last_name
                  type: VARCHAR(255)
              - column:
                  name: specialization
                  type: INT

  - changeSet:
      id: 004-add-doctors-user-fk
      author: kanapa4
      changes:
        - addForeignKeyConstraint:
            baseTableName: doctors
            baseColumnNames: user_id
            constraintName: fk_doctors_user_id
            referencedTableName: users
            referencedColumnNames: id

  - changeSet:
      id: 004-create-facilities
      author: kanapa4
      changes:
        - createTable:
            tableName: facilities
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: city
                  type: VARCHAR(255)
              - column:
                  name: zip_code
                  type: VARCHAR(255)
              - column:
                  name: street
                  type: VARCHAR(255)
              - column:
                  name: building_number
                  type: VARCHAR(255)

  - changeSet:
      id: 004-create-doctor-facility
      author: kanapa4
      changes:
        - createTable:
            tableName: doctor_facility
            columns:
              - column:
                  name: doctor_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: facility_id
                  type: BIGINT
                  constraints:
                    nullable: false

  - changeSet:
      id: 004-add-doctor-facility-pk
      author: kanapa4
      changes:
        - addPrimaryKey:
            tableName: doctor_facility
            columnNames: doctor_id, facility_id
            constraintName: pk_doctor_facility

  - changeSet:
      id: 004-add-doctor-facility-fks
      author: kanapa4
      changes:
        - addForeignKeyConstraint:
            baseTableName: doctor_facility
            baseColumnNames: doctor_id
            constraintName: fk_doctor_facility_doctor_id
            referencedTableName: doctors
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: doctor_facility
            baseColumnNames: facility_id
            constraintName: fk_doctor_facility_facility_id
            referencedTableName: facilities
            referencedColumnNames: id
